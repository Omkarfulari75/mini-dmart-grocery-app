services:
  # Express Backend Web Service
  - type: web
    name: mini-dmart-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: mini-dmart-secret-key-assessment-2026

  # React Frontend Static Site
  - type: web
    name: mini-dmart-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
